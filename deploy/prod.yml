# Ambiente REALE delle Iscrizioni della Pro Loco Villafrati APS.
# Avvio:          sudo docker compose -f deploy/prod.yml up -d --build
# Aggiornamento:  sudo aggiorna iscrizioni prod
# Il nome del progetto sta qui sotto: senza, 'aggiorna' lo ricava dalla
# cartella 'deploy' e va in conflitto col contenitore gia' avviato.
name: iscrizioni-reale
services:
  iscrizioni:
    build:
      context: ..
      dockerfile: Dockerfile
    image: iscrizioni:prod
    container_name: iscrizioni-reale
    restart: unless-stopped
    ports:
      - "127.0.0.1:8113:8000"
    volumes:
      - /srv/app-dati/iscrizioni/prod:/dati
      # La casella unica dei programmi dello studio, in sola
      # lettura: il programma la legge, non la cambia mai.
      - /srv/app-dati/posta.conf:/posta.conf:ro
    environment:
      ISCRIZIONI_CARTELLA_DATI: /dati
      ISCRIZIONI_COOKIE_SICURO: "1"
      ISCRIZIONI_DIETRO_PROXY: "1"
      TZ: Europe/Rome
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/salute')\""]
      interval: 30s
      timeout: 5s
      retries: 3
